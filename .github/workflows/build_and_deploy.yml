name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; wait for the running one instead of
# canceling it so the published site is never left half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # GitHub Pages serves the site from /<repo>/, so the SPA must be built
      # with that base path (kit.paths.base in vite.config.ts reads BASE_PATH).
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: actions/configure-pages@v6
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: SPA fallback for deep links
        # GitHub Pages answers every unknown URL with 404.html; a copy of the
        # SPA shell lets the client router resolve /<repo>/doc/1/query-like
        # deep links instead of showing the raw 404 page.
        run: cp build/index.html build/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
