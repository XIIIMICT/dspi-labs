name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint:check
      - run: bun run format:check
      - run: bun run test

  workflows:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The FULL history: a secret that was committed and then deleted is
          # still in every clone, so a shallow scan would miss exactly the leak
          # that matters most.
          fetch-depth: 0
      - name: Scan the history for secrets
        # Straight gitleaks run instead of gitleaks-action: the action scans
        # `<first pushed commit>^..HEAD`, which hard-fails when a push batch
        # contains the repository's root commit (`root^` does not exist). A
        # full-history scan avoids that and is the stricter gate — every run
        # rescans everything. .gitleaks.toml / .gitleaksignore are picked up
        # automatically; the binary is pinned and checksum-verified.
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing --check "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks detect --redact -v --exit-code=2 --no-banner

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          # Block a PR that introduces a known-vulnerable package.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
